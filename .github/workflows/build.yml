name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  IMAGE_NAME: distrox

jobs:
  # ===========================================================================
  # Build Job
  # ===========================================================================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build kernel stage
        uses: docker/build-push-action@v5
        with:
          context: .
          target: kernel-builder
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:kernel
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_JOBS=auto

      - name: Build rootfs stage
        uses: docker/build-push-action@v5
        with:
          context: .
          target: rootfs-builder
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:rootfs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_JOBS=auto

      - name: Extract artifacts
        run: |
          mkdir -p artifacts
          docker create --name distrox-kernel ${{ env.IMAGE_NAME }}:kernel
          docker cp distrox-kernel:/build/linux/arch/x86/boot/bzImage artifacts/bzImage
          docker rm distrox-kernel
          docker create --name distrox-rootfs ${{ env.IMAGE_NAME }}:rootfs
          docker cp distrox-rootfs:/build/rootfs.tar.gz artifacts/rootfs.tar.gz
          docker rm distrox-rootfs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-distribution
          path: artifacts/
          retention-days: 30

  # ===========================================================================
  # Test Job
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install local tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso bsdtar

      - name: Set up Zig
        if: ${{ hashFiles('userspace/build.zig') != '' }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: master

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-distribution
          path: ./artifacts

      - name: Validate kernel
        run: |
          file artifacts/bzImage | grep -q "Linux kernel x86 boot executable"
          test -s artifacts/bzImage

      - name: Validate rootfs
        run: |
          file artifacts/rootfs.tar.gz | grep -q "gzip compressed"
          tar tzf artifacts/rootfs.tar.gz | head -5

      - name: Build initramfs + ISO locally
        run: |
          mkdir -p build
          mv artifacts/bzImage artifacts/rootfs.tar.gz build/
          make userspace initramfs iso

      - name: Validate artifacts
        run: |
          file build/initramfs | grep -q "gzip compressed"
          file build/output.iso | grep -q "ISO 9660"

  # ===========================================================================
  # Lint Job
  # ===========================================================================
  lint:
    name: Lint and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          format: gcc
          severity: warning

      - name: Check shell scripts
        run: |
          sh -n init.sh
          for script in scripts/*.sh; do
            bash -n "$script"
          done