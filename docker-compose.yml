version: '3.8'

services:
  # =============================================================================
  # Builder service - Builds the rootfs (kernel is built separately, see Makefile)
  # =============================================================================
  builder:
    build:
      context: .
      dockerfile: Dockerfile
      target: rootfs-builder
      args:
        - LINUX_VERSION=master
        - BUILD_JOBS=auto
    image: distrox:latest
    container_name: distrox-builder
    volumes:
      # Mount output directory for extracting artifacts
      - ./build:/output
    command: >
      sh -c "
        echo 'Copying build artifacts to /output...' &&
        mkdir -p /output &&
        cp /build/rootfs.tar.gz /output/rootfs.tar.gz &&
        echo 'Build artifacts copied to ./build/' &&
        echo 'Rootfs: ./build/rootfs.tar.gz'
      "
    networks:
      - distrox-net

  # =============================================================================
  # Development service - Interactive shell inside the rootfs
  # =============================================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: rootfs-builder
    image: distrox:latest
    container_name: distrox-dev
    stdin_open: true
    tty: true
    volumes:
      - ./scripts:/scripts:ro
    environment:
      - PS1=\[\033[1;32m\]distrox-dev\[\033[0m\]:\[\033[1;34m\]\w\[\033[0m\]\$
    working_dir: /
    command: /bin/sh
    networks:
      - distrox-net
    profiles:
      - dev

# =============================================================================
# Networks
# =============================================================================
networks:
  distrox-net:
    driver: bridge
    name: distrox-network